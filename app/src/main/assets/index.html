        // 正在自转时切到「正面/摆动」：记录待生效目标，并锁定「下一个正面角」，等转回正面再切换
        pendingPose = target;
        // 爱心左右对称（heartX=16sin³t 为奇函数）→ |cosA|=1 时都是满宽正面，
        // 故「正面」每半圈(π)出现一次，不必等整整一圈(2π)：等待时间最长半圈。
        // 若点击瞬间本来就正对观众（|cosA|≈1），则无需再等，下一帧直接切。
        pendingFront = (Math.abs(Math.cos(spinAngle)) >= 0.98)
          ? spinAngle                                              // 已在正面 → 立即切
          : Math.ceil(spinAngle / Math.PI) * Math.PI;              // 否则等到下一个「正面」位（每半圈一次）
      } else {
        // 非自转态：直接切换
        HEART_POSE = target;
        spinAngle = 0;
        for (const p of heart) p.st = null;
      }
      // 高亮：待生效时高亮目标姿态，让用户看到已选中（爱心转回正面后才真正切换）
      document.querySelectorAll('#panel button[data-pose]').forEach(b =>
        b.classList.toggle('on', b.dataset.pose === (pendingPose ?? HEART_POSE)));
    });
  });

  // 微星效果：切换切割时银色星星的样式；「关闭」则完全禁用微星
  document.querySelectorAll('#panel button[data-star]').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.star;
      if (v === 'off') {
        starEnabled = false;
        stars.length = 0;                  // 立即清空已显示的微星
      } else {
        starEnabled = true;
        starStyle = +v;
      }
      document.querySelectorAll('#panel button[data-star]').forEach(b =>
        b.classList.toggle('on', b.dataset.star === v));
    });
  });


  // 下拉菜单（形成方式 / 重聚背景 / 动作 / 微星效果）：点击展开，点子项或空白处收起
  document.querySelectorAll('#panel .dropdown').forEach(dd => {
    const dropbtn = dd.querySelector('.dropbtn');
    dropbtn.addEventListener('click', e => {

      const willOpen = !dd.classList.contains('open');

  document.addEventListener('click', () => {            // 点击空白处收起所有下拉
    document.querySelectorAll('#panel .dropdown.open').forEach(o => o.classList.remove('open'));
  });

  /* ---------- 手势：握拳 → 张开五指 → 触发散开（效果同切割） ---------- */
  // 后台静默识别：不显示摄像头画面，仅借摄像头做手部姿态识别。
  // 与参考文件不同：参考「识别到张开即持续绽放」；本功能需「先握拳、再张开」的过渡才触发一次散开。
  let handEnabled = false;          // 手势开关（面板按钮控制）
  let handReady = false;            // MediaPipe + 摄像头是否就绪
  let fistSeen = false;             // 本轮是否已出现过握拳（握拳 → 张开 = 散开）
  let openSeen = false;             // 本轮是否已出现过张开（张开 → 握拳 = 重聚）

  let peaceHold = 0;                // 比耶连续保持帧数：需保持约 3 帧才触发（过滤握拳→张开过渡态）
  let openHold = 0;                 // 张开连续保持帧数：需保持约 5 帧才切割（防比耶偶发误判为全开）
  let handVideo = null, handStream = null, hands = null;

  // ===== 比耶 ✌ 触发流星雨（离屏透明层 · 一阵即止 · 含银色闪星）=====
  const METEOR_STYLES = {
    minimal: { density:.52, max:26, speed:[21,34], len:[160,360], width:[.8,1.4], angMin:.45, angMax:1.05, glow:0,   head:false, cols:[[255,255,255],[218,230,255]] },
    warm:    { density:.58, max:20, speed:[15,27], len:[170,420], width:[1,2.4],  angMin:.40, angMax:1.00, glow:.9,  head:true, headScale:1.1, cols:[[255,210,170],[255,180,200],[255,230,190]] }

  function meteorSpawn() {

    const r = Math.random();
    let pool, nMax, singleP, doubleP;
    if(r < 0.68){ pool=['willow','gold','minimal','warm','cool','redgold','violet','longline']; singleP=0.45; doubleP=0.40; nMax=3; }
    else if(r < 0.88){ pool=['chrysGold','chrysSilver']; singleP=0.40; doubleP=0.60; nMax=2; }  // 菊：双色(金+银)比例高，像红金国风
    else { pool=['realGold','realSilver','realRed','realBlue']; singleP=0.40; doubleP=0.40; nMax=3; }  // 真实彗星概率由 25% 降至 12%
    const rr = Math.random();
    let n = 1;
    if(nMax>=3 && rr>singleP+doubleP) n = 3;
    else if(rr>singleP) n = 2;
    const combo = [], tmp = pool.slice();   // 随机 n 个不重复基础款叠加（共享爆炸中心 → 多色组合）
    while(combo.length<n && tmp.length) combo.push(tmp.splice((Math.random()*tmp.length)|0,1)[0]);
    return combo;
  }

  function fwLaunch(combo, center){
    const first = FW[combo[0]];
    const sx = center ? W*0.5 : fwRnd(W*0.15, W*0.85);     // 巨大金银菊居中释放，普通烟花随机
    const ty = center ? H*0.45 : fwRnd(H*0.12, H*0.45);
    // 巨大金银菊(center)火箭上升速度放慢（释放速度放慢），普通烟花保持原速
    const vy = center ? -fwRnd(7,9) : -fwRnd(9,12.5);
    fwRockets.push({ x:sx, y:H+8, vx:fwRnd(-1,1), vy, ty, color:fwPick(first.colors), hist:[], combo });
  }

  function fwExplode(x, y, combo){
    for(const key of combo){
      const s = FW[key];
      const baseColor = fwPick(s.colors);
      const n = s.count;
      for(let i=0;i<n;i++){
        let ang, sp;
        if(s.ring){ ang=(i/n)*Math.PI*2; sp=(s.speedMin+s.speedMax)/2; }
        else if(s.layers){ const L=fwPick(s.layers); ang=fwRnd(0,Math.PI*2); sp=fwRnd(L[0],L[1]); }
        else { ang=fwRnd(0,Math.PI*2); sp=fwRnd(s.speedMin,s.speedMax); }
        const color = s.multi ? fwPick(s.colors) : baseColor;
        const life = fwRnd(s.lifeMin, s.lifeMax);
        const canSplit = !!(s.secondary && Math.random() < (s.splitChance||0.14));
        fwParts.push({ x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, life, maxLife:life, color, size:fwRnd(s.sizeMin,s.sizeMax), flick:Math.random()<0.30, split:canSplit, splitLife:canSplit?life*fwRnd(0.42,0.58):0, didSplit:false, hist:[], comet:!!s.comet, trailLen:s.trailLen||12, gravity:s.gravity, drag:s.drag });
      }
    }
  }

  function fwDrawTrail(hist, c, width, alpha){
    const col = `rgb(${c[0]},${c[1]},${c[2]})`;
    const n = hist.length;
    fctx.globalAlpha = alpha;
    fctx.strokeStyle = col; fctx.fillStyle = col;
    fctx.lineCap='round'; fctx.lineJoin='round';
    if(n<2){ if(n===1){ if(hist[0].comet) fwDrawHead(hist[0],width,c,alpha); else { fctx.beginPath(); fctx.arc(hist[0].x,hist[0].y,width,0,7); fctx.fill(); } } return; }
    if(hist[0].comet){
      for(let k=0;k<n-1;k++){ const t=1-k/(n-1); fctx.lineWidth=Math.max(0.6, width*(0.12+1.0*t)); fctx.beginPath(); fctx.moveTo(hist[k].x,hist[k].y); fctx.lineTo(hist[k+1].x,hist[k+1].y); fctx.stroke(); }
      fwDrawHead(hist[0],width,c,alpha);
    } else { fctx.lineWidth=width; fctx.beginPath(); fctx.moveTo(hist[0].x,hist[0].y); for(let k=1;k<n;k++) fctx.lineTo(hist[k].x,hist[k].y); fctx.stroke(); }
  }
  function fwDrawHead(h, w, c, a){ fctx.globalAlpha=a; fctx.fillStyle=`rgb(${c[0]},${c[1]},${c[2]})`; fctx.beginPath(); fctx.ellipse(h.x,h.y,w*1.3,w*0.9,0,0,7); fctx.fill(); }

  let fwActive = false;
  function fwUpdateDraw(){
    fctx.clearRect(0,0,W,H);
    fctx.globalCompositeOperation='lighter';
    for(let i=fwRockets.length-1;i>=0;i--){
      const r=fwRockets[i]; r.vy+=0.14; r.x+=r.vx; r.y+=r.vy;
      r.hist.unshift({x:r.x,y:r.y,comet:false}); if(r.hist.length>6) r.hist.pop();
      fwDrawTrail(r.hist, r.color, 1.6, 1);
      if(r.vy>=-1.2 || r.y<=r.ty){ fwExplode(r.x,r.y,r.combo); fwRockets.splice(i,1); }
    }
    for(let i=fwParts.length-1;i>=0;i--){
      const p=fwParts[i];
      p.vx*=p.drag; p.vy*=p.drag; p.vy+=p.gravity; p.x+=p.vx; p.y+=p.vy;
      if(p.split && !p.didSplit && p.life<=p.splitLife){
        const fn=5+(Math.random()*4|0);
        for(let j=0;j<fn;j++){ const a2=fwRnd(0,Math.PI*2), s2=fwRnd(1,2.6), l2=fwRnd(30,52); fwParts.push({x:p.x,y:p.y,vx:Math.cos(a2)*s2,vy:Math.sin(a2)*s2,life:l2,maxLife:l2,color:p.color,size:fwRnd(0.4,0.9),flick:true,split:false,didSplit:false,hist:[],comet:p.comet,trailLen:p.trailLen,gravity:0.05,drag:0.95}); }
        p.didSplit=true; fwParts.splice(i,1); continue;
      }
      p.life--; if(p.life<=0){ fwParts.splice(i,1); continue; }
      p.hist.unshift({x:p.x,y:p.y,comet:p.comet}); if(p.hist.length>p.trailLen) p.hist.pop();
      let a=p.life/p.maxLife; if(p.flick && a<0.6) a*=(0.35+Math.random()*0.65);
      fwDrawTrail(p.hist, p.color, p.size, a);
    }
    if(fwParts.length>FW_MAX) fwParts.splice(0, fwParts.length-FW_MAX);
    fctx.globalCompositeOperation='source-over'; fctx.globalAlpha=1;
  }

  function fwAutoFire(){
    if(!fwActive || fwPhase !== 1) return;        // 仅普通阶段发射；进入终场巨大金银菊阶段后自动停（期间禁其它烟花）
    const burst = 1 + (Math.random()<0.4?1:0);   // 偶发双发
    for(let k=0;k<burst;k++) fwLaunch(pickCombo());
    fwAutoTimer = setTimeout(fwAutoFire, fwRnd(650,1300));      // 稀疏：时不时来几朵
  }

  let fwEndTimer = null, fwAutoReform = false, fwPhase = 0, fwAutoTimer = null, fwGiantTimer = null;

  // 颜色复位为初始（白顶粉底渐变）：关掉纯色、清 colorTouched，所有在场粒子/球型贴图同步
  function resetInitialColor(){
    if (SOLID) { SOLID = false; solidBtn.classList.remove('on'); colorbox.classList.remove('solid'); }
    colorTouched = false;
    for (const p of heart) { const c = shapeColor(p.hy, p.idx); p.r = c.r; p.g = c.g; p.b = c.b; p.st = null; }
    if (PARTICLE_STYLE === 'sphere') buildSphereSprites();
  }

  // 夜空结束：停发烟花 → 颜色复位为初始 → 自动切割 → 置位「落定后自动重聚」
  function endNight(){
    if (!fwActive) return;
    fwActive = false; fwPhase = 0;
    if (fwEndTimer) { clearTimeout(fwEndTimer); fwEndTimer = null; }
    if (fwGiantTimer) { clearTimeout(fwGiantTimer); fwGiantTimer = null; }
    if (fwAutoTimer) { clearTimeout(fwAutoTimer); fwAutoTimer = null; }
    fwRockets.length = 0; fwParts.length = 0;          // 清场，干净交接到爱心切割
    resetInitialColor();
    if (!scattered && heartReady) { scatter(0, 0); fwAutoReform = true; }   // 自动切割，随后自动重聚
  }

  // 终场巨大金银菊：普通烟花放约 20s 后触发，单独释放一朵巨型金/银菊，期间禁止其它烟花；
  //   其升空+绽放约 5s 后由 endNight 收尾（自动切割爱心），实现「只有释放完巨大金银菊才可切割」。
  function startGiant(){
    if(!fwActive || fwPhase !== 1) return;
    fwPhase = 2;                                       // 进入终场阶段
    if(fwAutoTimer){ clearTimeout(fwAutoTimer); fwAutoTimer = null; }          // 停掉普通烟花连发
    if(fwGiantTimer){ clearTimeout(fwGiantTimer); fwGiantTimer = null; }
    const big = Math.random() < 0.5 ? 'chrysGoldGiant' : 'chrysSilverGiant';  // 随机金菊或银菊
    fwLaunch([big], true);                             // 单独释放一朵巨大金银菊（屏幕正中央）
    fwGiantPoll();                                    // 轮询：升空+绽放+花瓣分裂的小烟花全部消失后才允许切割
  }
  // 终场轮询：巨大金银菊升空→绽放→花瓣分裂的小烟花彻底释放完（fwRockets/fwParts 皆空）→ 才结束并切割爱心
  function fwGiantPoll(){
    if(!fwActive || fwPhase !== 2) return;            // 已结束或异常 → 退出
    if(fwRockets.length === 0 && fwParts.length === 0){ endNight(); return; }  // 全部放完（含小烟花）→ 才开始切割
    fwGiantTimer = setTimeout(fwGiantPoll, 250);       // 否则继续等（每 250ms 检查一次）
  }
  // 颜色切黑 → 夜空模式：SOLID（纯色模式）且纯色接近黑时开启，否则关闭
  function fwCheckNight(){
    const on = SOLID && Math.max(COL_SOLID.r, COL_SOLID.g, COL_SOLID.b) < 28;
    if (on && !fwActive) {
      fwActive = true; fwPhase = 1;                    // 普通烟花阶段
      if (fwEndTimer) { clearTimeout(fwEndTimer); fwEndTimer = null; }
      if (fwGiantTimer) { clearTimeout(fwGiantTimer); fwGiantTimer = null; }
      fwAutoFire();
      fwGiantTimer = setTimeout(startGiant, 20000);    // 约 20s 普通烟花后放巨大金银菊；总时长≈25s
    } else if (!on && fwActive) {
      endNight();                                      // 手动切回非黑：提前结束（主动退出，属例外）
    }
  }
  colSolid.addEventListener('input', fwCheckNight);
  solidBtn.addEventListener('click', ()=> setTimeout(fwCheckNight, 0));   // 纯色开关翻转后再判定

  requestAnimationFrame(loop);
})();
</script>
